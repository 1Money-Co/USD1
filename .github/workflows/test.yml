name: TEST-CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    env:
      # Match the toolchain used for the verified USD1 mainnet release.
      FOUNDRY_VERSION: v1.5.1
      # Official linux_amd64 release asset digest; update together with the version.
      # https://api.github.com/repos/foundry-rs/foundry/releases/tags/v1.5.1
      FOUNDRY_LINUX_AMD64_SHA256: 73640b01bd9ed29fdb4965085099371f8cf0dbbec3e2086cf54564efc4dcfe88
    steps:
      # No submodule handling: every dependency is vendored under lib/.
      - uses: actions/checkout@v7

      - name: Install Foundry
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64

          # Download the release directly: foundryup's attestation endpoint returns 5xx.
          # Verify against the pinned release digest before extracting any executables.
          foundry_archive="$RUNNER_TEMP/foundry-${FOUNDRY_VERSION}-linux-amd64.tar.gz"
          foundry_bin="$RUNNER_TEMP/foundry-${FOUNDRY_VERSION}/bin"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 180 \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz" \
            --output "$foundry_archive"
          printf '%s  %s\n' "$FOUNDRY_LINUX_AMD64_SHA256" "$foundry_archive" | sha256sum -c -
          mkdir -p "$foundry_bin"
          tar -xzf "$foundry_archive" -C "$foundry_bin" forge cast anvil chisel
          echo "$foundry_bin" >> "$GITHUB_PATH"

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Set up Node for upgrade validation
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Validate USD1 upgrade safety
        run: |
          # The two allowances are inherent to M0's extension pattern: MExtension fixes the
          # M token and SwapFacility as immutables in the constructor. Do not add more
          # without recording why here. Requires the full compilation from the build step.
          npx --yes @openzeppelin/upgrades-core@1.37.0 validate out/build-info \
            --contract src/v1/USD1.sol:USD1 \
            --unsafeAllow constructor,state-variable-immutable
        id: upgrade-safety

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
